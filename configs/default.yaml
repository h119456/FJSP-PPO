# Synthetic demonstration configuration. Physics values are not material data.
train_instance: data/examples/synthetic_train.json
eval_instance: data/examples/synthetic_test.json
output_dir: outputs/default_run
seed: 7
eval_seed: 1007
episodes: 40
model_type: mlp
observation_profile: unified23
action_feature_profile: compact21
hidden_dim: 128
learning_rate: 0.0003
gamma: 1.0  # undiscounted finite-horizon objective; rewards telescope to -J
gae_lambda: 0.95
clip_ratio: 0.2
value_coef: 0.5
entropy_coef: 0.01
ppo_epochs: 4
mini_batch_size: 64
max_grad_norm: 0.5
device: auto
